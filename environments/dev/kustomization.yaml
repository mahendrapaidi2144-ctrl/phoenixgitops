apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phoenix-dev
resources:
  - ../base
  - namespace.yaml
images:
  - name: phoenix-backend
    newTag: v2
  - name: phoenix-frontend
    newTag: v1
replicas:
  - name: phoenix-backend
    count: 1
  - name: phoenix-frontend
    count: 1
patches:
  - target: { kind: ConfigMap, name: phoenix-backend-config }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
  - target: { kind: Deployment, name: phoenix-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 250m, memory: 256Mi }
