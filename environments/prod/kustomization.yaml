apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phoenix-prod
resources:
  - ../base
  - namespace.yaml
images:
  - name: phoenix-backend
    newTag: v2
  - name: phoenix-frontend
    newTag: v1
replicas:
  - name: phoenix-backend
    count: 3
  - name: phoenix-frontend
    count: 2
patches:
  - target: { kind: ConfigMap, name: phoenix-backend-config }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
  - target: { kind: Deployment, name: phoenix-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 150m, memory: 192Mi }
          limits: { cpu: 500m, memory: 512Mi }
  - target: { kind: Service, name: phoenix-frontend }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
