apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mahendrapaidi2144-ctrl/phoenixgitops.git
    targetRevision: main
    path: environments/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: phoenix-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
